{% extends "template.html" %}
  {% block title %}Add New Event — BristolPulse{% endblock %}
  {% block content %}





    <!---------main content----------->

    <div class="container mt-5 pt-5 ">
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary mb-4">  ← Back to Dashboard</a>
        <div class="row justify-content-center ">
            <div class="col-md-8">

            <form method="POST" action="{{ url_for('add_event') }}">
        
                <div class="mb-3">
                    <label class="form-label">Event Name</label>
                    <input class="form-control" name="event_name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="event_description"></textarea>
                </div>

                <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Venue ID</label>
                    <input class="form-control" name="venue_id" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Category ID</label>
                    <input class="form-control" name="category_id" required>
                </div>
                </div>

                <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" name="day_date" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Start Time</label>
                    <input type="time" class="form-control" name="start_time" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">End Time</label>
                    <input type="time" class="form-control" name="end_time" required>
                </div>
                </div>

                <div class="mb-3">
                <label class="form-label">Price (£)</label>
                <input type="number" step="0.01" class="form-control" name="price" required>
                </div>

                <button class="btn btn-primary w-100">Add Event</button>

            </form>
            </div>
        </div>
    </div>
    {% endblock %}
