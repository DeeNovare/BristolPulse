{% extends "template.html" %}   
  {% block title %}Sign Up — BristolPulse{% endblock %}
  
  {% block content %}
  <!--Main content-->  
  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Sign up to book events, track your tickets and get Bristol highlights.</p>

      {% if error %} <!-- error for incorrect password input-->
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('signup') }}"> <!--using 'name' in the input makes the form interact with flask -->
        <div class="row g-3">
          <div class="col-md-6">
            <label for="signup-firstname" class="form-label">First name</label>
            <input type="text" name="first_name" class="form-control" id="signup-firstname" value="{{ first_name if first_name else '' }}" required>
          </div>

          <div class="col-md-6">
            <label for="signup-lastname" class="form-label">Last name</label>
            <input type="text" name="last_name" class="form-control" id="signup-lastname" value="{{ last_name if last_name else '' }}" required>
          </div>
        </div>

        <div class="mt-3">
          <label for="signup-email" class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" id="signup-email" placeholder="you@example.com" value="{{ email if email else '' }}" required>
        </div>

        <div class="mt-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" name="password" class="form-control" id="signup-password" required >
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()" ><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <input type="password" name="confirm_password" class="form-control" id="signup-confirm" required >
          </div>
        </div>


        <div class="form-check mt-3 mb-3">
          <input class="form-check-input" name="is_student" type="checkbox" id="signup-student">
          <label class="form-check-label" for="signup-student">
            I am a student and may be eligible for student discounts.
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Create account</button>

        <p class="auth-helper text-center mb-0">
          Already have an account?
          <a href="{{ url_for('login') }}">Login</a>
        </p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('signup-password');
      const confirmInput = document.getElementById('signup-confirm');
      const icon = document.querySelector(".fa-eye, .fa-eye-slash");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        confirmInput.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        passwordInput.type = "password";
        confirmInput.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }    
    }
  </script>
  {% endblock %}
