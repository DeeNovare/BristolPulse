{% extends "template.html" %}
  {% block title %}Login — BristolPulse{% endblock %}

  {% block content %}
  <!--Main content-->  
  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to manage your bookings and discover new events across Bristol.</p>

      <form method="POST" action="{{ url_for('login') }}" class="mt-4">
        <div class="mb-3">
          <label for="login-email" class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" id="login-email" placeholder="you@example.com" required>
        </div>

        <div class="mb-2">
          <label for="login-password" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" name="password" class="form-control" id="login-password" required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()" ><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember-me">
            <label class="form-check-label" for="remember-me">
              Remember me
            </label>
          </div>
          <a href="#" class="auth-helper">Forgot your password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>

        <p class="auth-helper text-center mb-0">
          Don't have an account?
          <a href="{{ url_for('signup') }}">Sign up</a>
        </p>
      </form>
    </div>
  </main>

  {% endblock %}
